server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: t47-order-anomaly
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/t47_anomaly?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义业务配置
t47:
  jwt:
    # 必须通过环境变量注入正式密钥；默认值仅供本地开发
    secret: ${JWT_SECRET:t47-dev-secret-key-must-be-at-least-32-bytes-long}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  anomaly:
    # 综合评分达到该阈值判定为异常
    flag-threshold: 60
    # 单笔订单金额风险阈值（元）
    high-amount: 5000

logging:
  level:
    com.t47.anomaly: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
